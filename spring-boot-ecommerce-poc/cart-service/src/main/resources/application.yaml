spring:
  application:
    name: cart-service
  data:
    redis:
      host: localhost
      port: 6379
  docker:
    compose:
      lifecycle-management: start-only
      file: ../compose.yaml

server:
  port: 8083

cart:
  ttl-hours: 24

inventory-service:
  url: http://localhost:8085

management:
  endpoints:
    web:
      exposure:
        include: health,info
