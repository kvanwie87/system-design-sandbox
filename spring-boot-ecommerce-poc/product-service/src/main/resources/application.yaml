spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce?currentSchema=product_schema
    username: ecommerce
    password: ecommerce
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: product_schema
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 600000
  kafka:
    bootstrap-servers: localhost:19092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  docker:
    compose:
      lifecycle-management: start-only
      file: ../compose.yaml

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
