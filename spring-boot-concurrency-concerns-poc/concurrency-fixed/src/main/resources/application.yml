server:
  port: 8082

spring:
  application:
    name: concurrency-fixed
  datasource:
    url: jdbc:h2:mem:fixeddb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
