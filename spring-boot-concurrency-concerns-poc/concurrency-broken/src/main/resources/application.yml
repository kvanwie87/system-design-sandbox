server:
  port: 8081

spring:
  application:
    name: concurrency-broken
  datasource:
    url: jdbc:h2:mem:brokendb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
