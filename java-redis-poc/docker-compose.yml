services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    profiles: ["infra", "app"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis-commander:
    image: rediscommander/redis-commander:latest
    ports:
      - "8081:8081"
    profiles: ["infra", "app"]
    environment:
      REDIS_HOSTS: local:redis:6379
    depends_on:
      redis:
        condition: service_healthy

  app:
    build: .
    ports:
      - "8080:8080"
    profiles: ["app"]
    environment:
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_healthy
